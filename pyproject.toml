[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribedesk"
version = "1.0.0"
description = "Assistant d'écriture système pour Service Desk, avec anonymisation des données personnelles avant tout envoi à un LLM."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ScribeDesk Contributors" }]
keywords = ["llm", "writing", "service-desk", "privacy", "pii", "anonymisation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: French",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]

# Le coeur (moteur de prompts, providers, anonymisation) n'a AUCUNE dependance Qt.
# Il s'installe seul, s'importe en 30 ms et se teste sans serveur graphique.
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.7",
    "pynput>=1.7",
    "keyring>=25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "respx>=0.21",
]

[project.scripts]
scribedesk = "scribedesk.cli:main"

[project.gui-scripts]
scribedesk-gui = "scribedesk.__main__:main"

[project.urls]
Homepage = "https://github.com/Geniiius/scribedesk"
Issues = "https://github.com/Geniiius/scribedesk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scribedesk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Les listes de mots-outils sont ecrites en chaines multilignes puis
# decoupees. Un litteral de liste etalerait soixante mots sur autant de
# lignes, pour un contenu qui se lit et se corrige comme du texte.
"src/scribedesk/language.py" = ["SIM905"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "C4", "PTH"]
ignore = [
    # Le code et la documentation sont en francais : les apostrophes
    # typographiques et les caracteres accentues sont voulus.
    "RUF001",
    "RUF002",
    "RUF003",
    # N818 impose le suffixe « Error ». « ProviderUnavailable » et
    # « KeyringUnavailable » se lisent mieux sans, et leur nature d'exception
    # est evidente a l'usage (`raise`, `except`).
    "N818",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pynput.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
