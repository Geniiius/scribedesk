name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le jeton n'a besoin que de lire le dépôt : ni publication, ni commentaire, ni
# écriture de paquet. Déclaré ici, il s'applique à tous les travaux et survit à
# un changement de réglage par défaut de l'organisation.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.14 figure ici parce que « requires-python = >=3.11 » n'a pas de
        # borne haute : promettre une version sans la tester n'engage personne.
        python: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    # Un test d'interface qui attend une fenêtre jamais affichée ne rend pas la
    # main. Sans borne, il consommerait six heures de quota par déclenchement.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Les tests d'interface tournent sans écran grâce au greffon « offscreen ».
      # Sous Linux, Qt réclame malgré tout quelques bibliothèques système.
      - name: Dépendances système Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Installer le projet
        run: pip install -e ".[gui,dev]"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=scribedesk --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[gui,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
